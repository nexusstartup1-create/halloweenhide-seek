<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B0B0C">
<title>Senza segnale · Night Hunt</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; min-height: 100dvh; display: grid; place-items: center; background: #0b0b0c; color: #fff;
         font-family: -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif; padding: 24px; box-sizing: border-box; }
  main { max-width: 380px; display: flex; flex-direction: column; gap: 14px; }
  h1 { font-size: 34px; margin: 0; letter-spacing: -0.02em; }
  p { margin: 0; color: rgba(235,235,245,.64); font-size: 17px; line-height: 1.4; }
  button { margin-top: 8px; border: 0; border-radius: 999px; min-height: 54px; font: inherit; font-weight: 600; background: #ff6600; color: #0b0b0c; }
</style>
</head>
<body>
<main>
  <h1>Niente segnale</h1>
  <p>Il telefono non è connesso. La partita continua sul server: appena torna la rete, riapri l'app e ritrovi tutto.</p>
  <p>Se ti stanno inseguendo, intanto scappa.</p>
  <button type="button" onclick="location.reload()">Riprova</button>
</main>
</body>
</html>
